    # -----------------------------------------------------
    - cron: '30 3 27 10 *'   # O'zb 08:30 (UTC 03:30) - Statistika
    - cron: '00 5 27 10 *'   # O'zb 10:00 (UTC 05:00) - Ekonometrika
