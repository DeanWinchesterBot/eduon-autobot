name: EduOn Smooth Auto Bot

on:
  schedule:
    # O'zbekiston vaqti bilan dushanba-juma kunlari 08:00 dan 15:00 gacha har 15 daqiqada
    # UTC vaqtida bu: 03:00 dan 10:00 gacha
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch: # Qo'lda yoqish imkoniyati

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Kodni yuklash
      uses: actions/checkout@v4

    - name: Python muhitini sozlash
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # SESSID COOKIES KESH TIZIMI
    - name: EduOn Sessiyasini keshdan tiklash
      uses: actions/cache@v4
      with:
        path: cookies.json
        key: eduon-session-cache-${{ github.run_id }}
        restore-keys: |
          eduon-session-cache-

    # PLAYWRIGHT VA BRAUZERLARNI O'RNATISH
    - name: Kerakli kutubxonalarni o'rnatish
      run: |
        python -m pip install --upgrade pip
        pip install playwright
        playwright install chromium

    # KONSOLDA REAL VAQTDA LOGLARNI KO'RISH (python -u)
    - name: Botni ishga tushirish
      run: python -u bot.py

    # DARSGA KIRILGANIDAGI ISBOT RASMI
    - name: Dars skrinshotini yuklash
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dars-isboti
        path: darsga_kirildi.png
        if-no-files-found: ignore
