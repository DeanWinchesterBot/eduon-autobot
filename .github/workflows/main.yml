name: EduOn Avto Kirish

on:
  workflow_dispatch: # Bu satr botni hozir qo'lda ishga tushirish imkonini beradi
  schedule:
    - cron: '30 3 * * 1-6'
    - cron: '00 5 * * 1-6'
    - cron: '00 7 * * 1-6'
# Qolgan qismlariga tegmaymiz...

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Kodni yuklash
      uses: actions/checkout@v3

    - name: Python sozlash
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Brauzer muhitini yuklash
      run: |
        pip install playwright
        playwright install chromium

    - name: Botni ishga tushirish
      run: python bot.py
