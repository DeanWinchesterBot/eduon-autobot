jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Kodni yuklash
      uses: actions/checkout@v4

    - name: Python sozlash
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Brauzer muhitini yuklash
      run: |
        pip install playwright requests
        playwright install chromium

    - name: Botni ishga tushirish
      run: python bot.py
