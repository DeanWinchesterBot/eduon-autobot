name: EduOn Avto Kirish

on:
  schedule:
    # O'zbekiston vaqti bilan soat 08:30 da botni ishga tushirish (UTC 03:30)
    - cron: '30 3 * * 1-6'
    # O'zbekiston vaqti bilan soat 10:00 da botni ishga tushirish (UTC 05:00)
    - cron: '00 5 * * 1-6'
    # O'zbekiston vaqti bilan soat 12:00 da botni ishga tushirish (UTC 07:00)
    - cron: '00 7 * * 1-6'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Kodni yuklash
      uses: actions/checkout@v3

    - name: Python sozlash
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Brauzer muhitini yuklash
      run: |
        pip install playwright
        playwright install chromium

    - name: Botni ishga tushirish
      run: python bot.py
