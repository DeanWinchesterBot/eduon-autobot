name: EduOn Smooth Auto Bot

on:
  schedule:
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Kodni yuklash
      uses: actions/checkout@v4

    - name: Python muhitini sozlash
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: EduOn Sessiyasini keshdan tiklash
      uses: actions/cache@v4
      with:
        path: cookies.json
        key: eduon-session-cache-${{ github.run_id }}
        restore-keys: |
          eduon-session-cache-

    - name: Kerakli kutubxonalarni o'rnatish
      run: |
        python -m pip install --upgrade pip
        pip install playwright
        playwright install chromium

    - name: Botni ishga tushirish
      run: python bot.py

    - name: Dars skrinshotini yuklash
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dars-isboti
        path: darsga_kirildi.png
        if-no-files-found: ignore
