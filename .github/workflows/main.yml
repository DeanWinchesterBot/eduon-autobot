name: Eduon Auto Lesson Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "lesson = darsga kirish, schedule = jadvalni o'qish"
        default: lesson
        type: choice
        options:
          - lesson
          - schedule

permissions:
  contents: read

concurrency:
  group: eduon-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 130

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Python-ni sozlash
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install playwright python-dotenv google-genai

      - name: ffmpeg (audio uchun)
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Playwright brauzerini o'rnatish
        run: |
          playwright install --with-deps chromium

      - name: Botni ishga tushirish
        env:
          ONEID_LOGIN: ${{ secrets.ONEID_LOGIN }}
          ONEID_PASSWORD: ${{ secrets.ONEID_PASSWORD }}
          EDUON_COOKIES: ${{ secrets.EDUON_COOKIES }}
          EDUON_LOCALSTORAGE: ${{ secrets.EDUON_LOCALSTORAGE }}
          WAIT_MINUTES: '20'
          MODE: ${{ inputs.mode }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SESSION_URL: ${{ secrets.SESSION_URL }}
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
        run: |
          python -u bot.py
