name: Eduon Auto Lesson Bot

on:
  workflow_dispatch: # GitHub sahifasidan o'zingiz qo'lda 'Run workflow' qilib tekshirib ko'rishingiz uchun
  schedule:
    # Toshkent vaqti (UTC+5) bo'yicha dars boshlanish vaqtlari (Dushanba - Juma):
    # 08:30 dars uchun (UTC bo'yicha 03:30)
    - cron: '30 3 * * 1-5'
    # 10:00 dars uchun (UTC bo'yicha 05:00)
    - cron: '0 5 * * 1-5'
    # 12:00 dars uchun (UTC bo'yicha 07:00)
    - cron: '0 7 * * 1-5'
    # 13:30 dars uchun (UTC bo'yicha 08:30)
    - cron: '30 8 * * 1-5'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Python-ni sozlash
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install playwright python-dotenv
          playwright install --with-deps chromium

      - name: Botni ishga tushirish
        env:
          ONEID_LOGIN: ${{ secrets.ONEID_LOGIN }}
          ONEID_PASSWORD: ${{ secrets.ONEID_PASSWORD }}
        run: |
          python bot.py

      - name: Skrinshotlarni saqlash (Tekshirish uchun)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-screenshots
          path: '*.png'
