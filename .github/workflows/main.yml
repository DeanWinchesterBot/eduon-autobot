name: Eduon Auto Lesson Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1-5' # 08:30
    - cron: '0 5 * * 1-5'  # 10:00
    - cron: '0 7 * * 1-5'  # 12:00
    - cron: '30 8 * * 1-5' # 13:30

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Python-ni sozlash
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install playwright python-dotenv

      - name: Playwright brauzerini o'rnatish
        run: |
          playwright install chromium

      - name: Botni ishga tushirish
        env:
          ONEID_LOGIN: ${{ secrets.ONEID_LOGIN }}
          ONEID_PASSWORD: ${{ secrets.ONEID_PASSWORD }}
        run: |
          python bot.py

      - name: Skrinshotlarni saqlash (Tekshirish uchun)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-screenshots
          path: '*.png'
